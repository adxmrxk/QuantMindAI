[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmind"
version = "0.1.0"
description = "AI-powered quantitative research platform — market regime detection slice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3.2",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Heavy ML stack — needed by the forecaster (Phase 2), RL agent (Phase 3) and
# GNN (Phase 4), but NOT by the API/dashboard, which stays lean.
ml = [
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "networkx>=3.0",
]
# Optional Claude generation for the research copilot (Phase 5).
llm = ["anthropic>=0.39"]
# Optional experiment tracking (Phase 6).
mlops = ["mlflow>=2.10"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "networkx>=3.0",
    "anthropic>=0.39",
]

[tool.setuptools.packages.find]
include = ["quantmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
