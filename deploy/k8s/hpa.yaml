apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quantmind-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quantmind-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantmind-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: quantmind.example.com   # set to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantmind-api
                port:
                  number: 80
