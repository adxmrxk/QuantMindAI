apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantmind-api
  labels:
    app: quantmind-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantmind-api
  template:
    metadata:
      labels:
        app: quantmind-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/quantmind:latest   # set to your pushed image
          ports:
            - containerPort: 8000
          env:
            - name: QUANTMIND_MLFLOW
              valueFrom:
                configMapKeyRef:
                  name: quantmind-config
                  key: QUANTMIND_MLFLOW
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantmind-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
