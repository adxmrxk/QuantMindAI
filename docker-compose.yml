# QuantMind full stack. Run with:  docker compose up --build
# Then open http://localhost:8000
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QUANTMIND_MLFLOW=0
      - QUANTMIND_RETRIEVER=qdrant         # use the Qdrant vector backend
      - QDRANT_URL=http://qdrant:6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}   # enables Claude-generated answers
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Single-node Kafka in KRaft mode (no ZooKeeper) for the streaming pipeline.
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes

volumes:
  qdrant_data:
