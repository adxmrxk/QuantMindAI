# QuantMind full stack. Run with:  docker compose up --build
# Then open http://localhost:8000
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QUANTMIND_MLFLOW=0
      - QUANTMIND_RETRIEVER=qdrant         # use the Qdrant vector backend
      - QDRANT_URL=http://qdrant:6333
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}   # enables Claude-generated answers
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
